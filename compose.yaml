services:
  mysql-container:
    image: mysql:latest
    environment:
      - MYSQL_ROOT_PASSWORD=admin
    ports:
      - "3307:3306"
    volumes:
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
    hostname: mysql-host-productsmicroservice

  products-microservice:
    image: ms2002/ecommerce-products-microservice:v1.0
    environment:
      MYSQL_HOST: mysql-container
      MYSQL_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - ecommerce-network
  postgres-container:
    image: postgres:19rc1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=eCommerceUsers
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - ecommerce-network
  users-microservice:
    image: ms2002/ecommerce-users-microservice:v1.0
    environment:
      POSTGRES_HOST: postgres-container
      POSTGRES_PASSWORD: admin
      Jwt__Key: MySuperSecureJWTSecretKey2026_123456789
    ports:
      - "18090:9090"
    networks:
      - ecommerce-network
networks:
  ecommerce-network:
    driver: bridge
